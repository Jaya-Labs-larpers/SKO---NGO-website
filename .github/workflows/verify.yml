name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history — a secret committed and then "removed" is still a leak.
          fetch-depth: 0

      # Pinned binary with checksum rather than gitleaks-action, which needs a
      # paid licence on organisation repositories.
      - name: Secret scan (git history)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (locked)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Regression tests
        run: npm test

      - name: Build and run structural checks
        run: npm run verify

      - name: Audit all dependencies
        run: npm audit --audit-level=moderate

  lighthouse:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Serve the build
        run: npx --yes serve dist -l 4321 &

      - name: Wait for the server
        run: npx --yes wait-on http://127.0.0.1:4321 --timeout 60000

      # Mobile profile — that is the one that matters for this audience.
      # Thresholds match the definition of done, not Lighthouse's defaults.
      #
      # Each URL is audited RUNS times and the median score per category is
      # what gets compared to the floor. A single run on a shared GitHub runner
      # is noisy: the performance score depends on observed CPU timings, and a
      # busy neighbour on the host has dropped an otherwise-99 homepage to 76 on
      # a docs-only PR. Median-of-three is Lighthouse's own recommendation for
      # CI (https://github.com/GoogleChrome/lighthouse/blob/main/docs/variability.md).
      #
      # is-crawlable is skipped on purpose: CI builds with fixture content, which
      # deliberately ships noindex (src/lib/config.ts, preventIndexing), so that
      # one audit is always red here and dragged SEO to 66. Remove the flag when
      # PUBLIC_CONTENT_SOURCE=sanity content goes live and production must index.
      - name: Lighthouse (English and Khmer homepages)
        env:
          RUNS: 3
        run: |
          mkdir -p lighthouse-reports
          for url in http://127.0.0.1:4321/ http://127.0.0.1:4321/km/; do
            slug=$(echo "$url" | sed -E 's#https?://[^/]+/##; s#/$##; s#/#-#g')
            slug=${slug:-home}
            for i in $(seq 1 "$RUNS"); do
              npx --yes lighthouse@12 "$url" \
                --quiet --chrome-flags="--headless=new --no-sandbox" \
                --skip-audits=is-crawlable \
                --output=json --output-path="./lighthouse-reports/${slug}-${i}.json"
            done
            node -e '
              const fs = require("fs");
              const [slug, runs] = process.argv.slice(1);
              const reports = Array.from({ length: Number(runs) }, (_, i) =>
                JSON.parse(fs.readFileSync(`./lighthouse-reports/${slug}-${i + 1}.json`, "utf8")));
              const floors = { performance: 90, accessibility: 95, "best-practices": 95, seo: 95 };
              const median = (xs) => {
                const s = [...xs].sort((a, b) => a - b);
                const m = s.length >> 1;
                return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
              };
              let failed = false;
              console.log(`${reports[0].finalDisplayedUrl}  (median of ${reports.length} runs)`);
              for (const [key, floor] of Object.entries(floors)) {
                const scores = reports.map((r) => Math.round(r.categories[key].score * 100));
                const score = Math.round(median(scores));
                const ok = score >= floor;
                if (!ok) failed = true;
                console.log(`${ok ? "PASS" : "FAIL"}  ${key.padEnd(16)} ${score} (floor ${floor})  runs: ${scores.join(" ")}`);
              }
              if (failed) process.exit(1);
            ' "$slug" "$RUNS"
          done

      # Keep the raw reports so a red run can be diagnosed, not just re-run.
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          retention-days: 14

  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
        working-directory: studio
      - run: npm run typecheck
        working-directory: studio
      - run: npm test
        working-directory: studio
      - name: Build Studio with a non-live project ID
        run: npm run build
        working-directory: studio
        env:
          SANITY_STUDIO_PROJECT_ID: abc12345
      - run: npm audit --audit-level=moderate
        working-directory: studio
