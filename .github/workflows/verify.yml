name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history — a secret committed and then "removed" is still a leak.
          fetch-depth: 0

      # Pinned binary with checksum rather than gitleaks-action, which needs a
      # paid licence on organisation repositories.
      - name: Secret scan (git history)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (locked)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Regression tests
        run: npm test

      - name: Build and run structural checks
        run: npm run verify

      - name: Audit all dependencies
        run: npm audit --audit-level=moderate

  lighthouse:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Serve the build
        run: npx --yes serve dist -l 4321 &

      - name: Wait for the server
        run: npx --yes wait-on http://127.0.0.1:4321 --timeout 60000

      # Mobile profile — that is the one that matters for this audience.
      # Thresholds match the definition of done, not Lighthouse's defaults.
      - name: Lighthouse (English and Khmer homepages)
        run: |
          for url in http://127.0.0.1:4321/ http://127.0.0.1:4321/km/; do
            npx --yes lighthouse@12 "$url" \
              --quiet --chrome-flags="--headless=new --no-sandbox" \
              --output=json --output-path=./report.json
            node -e '
              const r = require("./report.json");
              const floors = { performance: 90, accessibility: 95, "best-practices": 95, seo: 95 };
              let failed = false;
              for (const [key, floor] of Object.entries(floors)) {
                const score = Math.round(r.categories[key].score * 100);
                const ok = score >= floor;
                if (!ok) failed = true;
                console.log(`${ok ? "PASS" : "FAIL"}  ${key.padEnd(16)} ${score} (floor ${floor})`);
              }
              if (failed) process.exit(1);
            '
          done

  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
        working-directory: studio
      - run: npm run typecheck
        working-directory: studio
      - run: npm test
        working-directory: studio
      - name: Build Studio with a non-live project ID
        run: npm run build
        working-directory: studio
        env:
          SANITY_STUDIO_PROJECT_ID: abc12345
      - run: npm audit --audit-level=moderate
        working-directory: studio
