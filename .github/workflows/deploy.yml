name: Deploy

# Production deploys happen here and nowhere else. A push to main that passes
# the one command (tests, typecheck, build with CSP and structural checks) is
# deployed to the sko-website-production Worker, then checked live.
#
# Until CLOUDFLARE_API_TOKEN exists as a repository secret the deploy steps are
# skipped and the job still goes green, so main is never red for a missing
# credential. Create the token from the "Edit Cloudflare Workers" template with
# the samatapheapkhnom.org zone included, and store it with
# `gh secret set CLOUDFLARE_API_TOKEN`. Never the Global API Key.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 19 * * *"
  # Also how a Studio publish rebuilds the site: a Sanity webhook calls the
  # workflow dispatch API (docs/16-cloudflare-workers.md).
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, in order. A second push waits rather than racing.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.samatapheapkhnom.org
    env:
      PUBLIC_DEPLOYMENT_ENV: production
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PUBLIC_CONTENT_SOURCE: ${{ vars.PUBLIC_CONTENT_SOURCE }}
      PUBLIC_CONTACT_ENABLED: ${{ vars.PUBLIC_CONTACT_ENABLED }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
      PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CF_ANALYTICS_TOKEN }}
      PUBLIC_SANITY_PROJECT_ID: ${{ vars.PUBLIC_SANITY_PROJECT_ID }}
      PUBLIC_SANITY_DATASET: ${{ vars.PUBLIC_SANITY_DATASET }}
      PUBLIC_SANITY_API_VERSION: ${{ vars.PUBLIC_SANITY_API_VERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (locked)
        run: npm ci

      - name: The one command
        run: npm run check

      - name: Deploy credentials present?
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; build verified, deploy skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      # The exact version serving traffic now, so a failed deploy returns to it
      # rather than to whatever Cloudflare counts as "previous". Empty when it
      # cannot be read; the deploy still runs, without the automatic rollback.
      - name: Record the live version
        id: previous
        if: steps.creds.outputs.ready == 'true'
        run: |
          version=$(npx wrangler deployments status --env production --json | node -e '
            let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
              const top = JSON.parse(s).versions.sort((a, b) => b.percentage - a.percentage)[0];
              process.stdout.write(top?.version_id ?? "");
            });') || version=""
          if [ -z "$version" ]; then
            echo "::warning::Could not read the live version; this deploy has no automatic rollback."
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers (production)
        if: steps.creds.outputs.ready == 'true'
        run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Live checks against production
        id: live
        if: steps.creds.outputs.ready == 'true'
        run: npm run check:edge -- https://www.samatapheapkhnom.org --expect-build

      # The new version is already serving when the live checks fail, so put the
      # recorded one back. The job stays failed either way, and GitHub emails.
      - name: Roll back to the recorded version
        id: rollback
        if: failure() && steps.live.outcome == 'failure' && steps.previous.outputs.version != ''
        run: |
          npx wrangler rollback "$VERSION" --env production --yes \
            --message "Live checks failed in Deploy run $RUN_ID"
          echo "::error::Live checks failed; rolled back to version $VERSION."
        env:
          VERSION: ${{ steps.previous.outputs.version }}
          RUN_ID: ${{ github.run_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Live checks after rollback
        if: failure() && steps.rollback.outcome == 'success'
        run: npm run check:edge -- https://www.samatapheapkhnom.org
