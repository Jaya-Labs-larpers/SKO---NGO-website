name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# Every third-party action below is pinned to a commit SHA. Mutable tags
# (`@v1`) would let an upstream change run with this job's OAuth token and
# OIDC identity without any change in this repo. Bump the SHAs deliberately;
# the trailing comment records the tag they came from. The plugin marketplace
# is the one exception and cannot be pinned -- see the note on
# `plugin_marketplaces` below.
jobs:
  claude-review:
    # Only PRs from branches in this repository, opened by people with write
    # access, get the credentialed review. Fork PRs receive no secrets anyway;
    # this makes the boundary explicit rather than relying on that default.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@3b8197d3d486006dd4af54613517f21ac6ac625e # v1.0.227
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The `claude-code-plugins` name is reserved by Claude Code for
          # official Anthropic marketplaces and is only granted to GitHub
          # sources under the `anthropics` org, so a local checkout cannot
          # supply it. This action version accepts only a local path or an
          # `https://...git` URL (base-action/src/install-plugins.ts), and
          # `claude plugin marketplace add` has no ref/commit option, so the
          # marketplace itself cannot be SHA-pinned here; a `#<ref>` suffix is
          # read as a branch and is rejected by the action's URL check anyway.
          # Every other third-party reference in this file stays SHA-pinned.
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
